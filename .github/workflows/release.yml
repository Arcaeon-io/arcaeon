# Release arcaeon to PyPI with Trusted Publishing (GitHub OIDC). No API token
# exists anywhere in this file or in the repo's settings: PyPI trusts this
# workflow file, in this repo, running in the named environment. Uploads made
# this way carry PEP 740 attestations. How it runs, and the two settings that
# are the owner's: docs/RELEASE.md.
#
#   push a tag v0.11.0           -> build, publish to PyPI, verify
#   Actions > release > Run      -> choose testpypi (the dry run) or pypi
#
# Third-party actions are pinned to major tags, not commit SHAs (see
# docs/RELEASE.md, "Limits").
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish: testpypi is the dry run (use an rc version), pypi is the real index (run on a v* tag)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      target: ${{ steps.guard.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version guard (tag == pyproject == arcaeon.__version__)
        id: guard
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
        run: |
          ver=$(python tools/release_guard.py --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" --target "$TARGET")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "release $ver to $TARGET"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade "build>=1,<2" "twine>=6,<7"
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m build
          ls -l dist/
      - name: twine check
        run: twine check --strict dist/*
      - name: Record sha256 of every built file
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: python tools/verify_published.py manifest dist/ --version "$VERSION" --out release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/arcaeon/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

  publish-testpypi:
    needs: build
    if: needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/arcaeon/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

  verify:
    needs: [build, publish-pypi, publish-testpypi]
    if: ${{ !cancelled() && !failure() && (needs.publish-pypi.result == 'success' || needs.publish-testpypi.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: manifest/
      - name: Download what the index serves, compare sha256 with the build
        env:
          INDEX_URL: ${{ needs.build.outputs.target == 'testpypi' && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          vpy="$RUNNER_TEMP/clean/bin/python"
          "$vpy" -m pip install --index-url https://pypi.org/simple/ "setuptools>=77"
          "$vpy" tools/verify_published.py fetch --manifest manifest/release-manifest.json --index-url "$INDEX_URL" --dest "$RUNNER_TEMP/downloaded" --attempts 10 --wait 30
