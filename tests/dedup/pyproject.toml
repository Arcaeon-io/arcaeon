[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaeon-dedup"
version = "0.1.5"
description = "Strip near-duplicate text from an agent's context before it costs tokens. Pure stdlib, no LLM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arcaeon" }]
keywords = ["ai", "agent", "llm", "context", "token", "deduplication", "dedupe",
            "simhash", "context-engineering", "token-savings", "rag"]
dependencies = []

[project.urls]
Homepage = "https://arcaeon.io"
Source = "https://github.com/Arcaeon-io/arcaeon-dedup"

[tool.setuptools]
packages = ["arcaeon_dedup"]
