[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcaeon-continuity"
version = "0.2.4"
description = "The agent-continuity primitive: carry your load-bearing self forward across a reset as a manifest you control, prove the next instance is a faithful continuation, and get a tamper-evident receipt of anything a compaction cut."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arcaeon" }]
keywords = ["ai", "agents", "continuity", "memory", "context", "compaction",
            "audit", "tamper-evident", "provenance", "identity", "migration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "arcaeon-ledger>=0.5.6",
  "arcaeon-baseline>=0.1.0",
  "arcaeon-compact>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "hypothesis>=6",
]

[project.urls]
Homepage = "https://arcaeon.io"
Changelog = "https://github.com/Arcaeon-io/arcaeon-continuity/blob/main/CHANGELOG.md"
Source = "https://github.com/Arcaeon-io/arcaeon-continuity"
Issues = "https://github.com/Arcaeon-io/arcaeon-continuity/issues"

[tool.hatch.build.targets.wheel]
packages = ["arcaeon_continuity"]
