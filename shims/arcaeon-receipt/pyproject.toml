[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaeon-receipt"
# one patch above the old line: PyPI last 0.2.0
version = "0.2.1"
description = "Compatibility shim: arcaeon-receipt is now part of arcaeon (arcaeon.record.receipt). Installs arcaeon; goes away with arcaeon 1.0.0."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arcaeon" }]
dependencies = ["arcaeon>=0.9,<1"]

[project.scripts]
arcaeon-receipt = "arcaeon_receipt:_script_arcaeon_receipt"

[project.urls]
Homepage = "https://arcaeon.io"

[tool.setuptools]
packages = ["arcaeon_receipt"]
