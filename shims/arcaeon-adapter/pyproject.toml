[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaeon-adapter"
# one patch above the old line: PyPI last 0.2.0
# 0.2.2: re-release so the wheel carries the shim's own __version__ (cb45976); 0.2.1 shipped the moved code's string
version = "0.2.2"
description = "Compatibility shim: arcaeon-adapter is now part of arcaeon (arcaeon.record.adapter). Installs arcaeon; no removal date yet (set from download counts)."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arcaeon" }]
dependencies = ["arcaeon>=0.9,<1"]

[project.scripts]
arcaeon-adapter = "arcaeon_adapter:_script_arcaeon_adapter"
arcaeon-adapter-selftest = "arcaeon_adapter:_script_arcaeon_adapter_selftest"

[project.urls]
Homepage = "https://arcaeon.io"

[tool.setuptools]
packages = ["arcaeon_adapter"]
