[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaeon-compact"
# one patch above the old line: PyPI last 0.1.5
# 0.1.7: re-release so the wheel carries the shim's own __version__ (cb45976); 0.1.6 shipped the moved code's string
version = "0.1.7"
description = "Compatibility shim: arcaeon-compact is now part of arcaeon (arcaeon.prove.compact). Installs arcaeon; goes away with arcaeon 1.0.0."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arcaeon" }]
dependencies = ["arcaeon>=0.9,<1"]

[project.urls]
Homepage = "https://arcaeon.io"

[tool.setuptools]
packages = ["arcaeon_compact"]
