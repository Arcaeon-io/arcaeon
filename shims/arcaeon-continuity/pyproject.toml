[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaeon-continuity"
# one patch above the old line: PyPI last 0.2.4
# 0.2.6: re-release so the wheel carries the shim's own __version__ (cb45976); 0.2.5 shipped the moved code's string
version = "0.2.6"
description = "Compatibility shim: arcaeon-continuity is now part of arcaeon (arcaeon.prove.continuity). Installs arcaeon; no removal date yet (set from download counts)."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arcaeon" }]
dependencies = ["arcaeon>=0.9,<1"]

[project.urls]
Homepage = "https://arcaeon.io"

[tool.setuptools]
packages = ["arcaeon_continuity"]
