[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaeon-continuity"
# one patch above the old line: PyPI last 0.2.4
version = "0.2.5"
description = "Compatibility shim: arcaeon-continuity is now part of arcaeon (arcaeon.prove.continuity). Installs arcaeon; goes away with arcaeon 1.0.0."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arcaeon" }]
dependencies = ["arcaeon>=0.9,<1"]

[project.urls]
Homepage = "https://arcaeon.io"

[tool.setuptools]
packages = ["arcaeon_continuity"]
