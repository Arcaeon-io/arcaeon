[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaeon-baseline"
# one patch above the old line: PyPI last 0.1.9
# 0.1.11: re-release so the wheel carries the shim's own __version__ (cb45976); 0.1.10 shipped the moved code's string
version = "0.1.11"
description = "Compatibility shim: arcaeon-baseline is now part of arcaeon (arcaeon.prove.baseline). Installs arcaeon; goes away with arcaeon 1.0.0."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arcaeon" }]
dependencies = ["arcaeon>=0.9,<1"]

[project.scripts]
arcaeon-baseline = "arcaeon_baseline:_script_arcaeon_baseline"

[project.urls]
Homepage = "https://arcaeon.io"

[tool.setuptools]
packages = ["arcaeon_baseline"]
