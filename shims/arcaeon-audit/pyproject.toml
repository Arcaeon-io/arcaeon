[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaeon-audit"
# one patch above the old line: PyPI last 0.1.8
version = "0.1.9"
description = "Compatibility shim: arcaeon-audit is now part of arcaeon (arcaeon.prove.audit). Installs arcaeon; goes away with arcaeon 1.0.0."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arcaeon" }]
dependencies = ["arcaeon>=0.9,<1"]

[project.scripts]
arcaeon-audit = "arcaeon_audit:_script_arcaeon_audit"

[project.urls]
Homepage = "https://arcaeon.io"

[tool.setuptools]
packages = ["arcaeon_audit"]
